apiVersion: apps/v1
kind: Deployment
metadata:
  name: x4g4t-redis
  namespace: x4g4t
  labels:
    app: x4g4t-redis
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: x4g4t-redis
  template:
    metadata:
      labels:
        app: x4g4t-redis
    spec:
      containers:
        - name: redis
          image: redis:7-alpine
          ports:
            - containerPort: 6379
              name: redis
          volumeMounts:
            - name: redis-data
              mountPath: /data
          readinessProbe:
            exec:
              command:
                - redis-cli
                - ping
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            exec:
              command:
                - redis-cli
                - ping
            initialDelaySeconds: 15
            periodSeconds: 10
      volumes:
        - name: redis-data
          persistentVolumeClaim:
            claimName: x4g4t-redis-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: x4g4t-redis
  namespace: x4g4t
spec:
  ports:
    - port: 6379
      targetPort: 6379
      name: redis
  selector:
    app: x4g4t-redis

