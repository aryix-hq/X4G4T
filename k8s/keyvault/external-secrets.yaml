# ============================================================================
# External Secrets Operator (ESO) Integration for Cloud KeyVaults
# Syncs secrets from Azure Key Vault, AWS Secrets Manager, or HashiCorp Vault
# ============================================================================

apiVersion: external-secrets.io/v1beta1
kind: SecretStore
metadata:
  name: x4g4t-keyvault-store
  namespace: x4g4t
spec:
  provider:
    # ------------------------------------------------------------------------
    # Option A: HashiCorp Vault Provider
    # ------------------------------------------------------------------------
    vault:
      server: "https://vault.corp.internal:8200"
      path: "secret"
      version: "v2"
      auth:
        kubernetes:
          mountPath: "kubernetes"
          role: "x4g4t-role"

    # ------------------------------------------------------------------------
    # Option B: Azure Key Vault Provider (Uncomment if using Azure)
    # ------------------------------------------------------------------------
    # azurekv:
    #   vaultUrl: "https://x4g4t-kv.vault.azure.net"
    #   authType: ManagedIdentity

    # ------------------------------------------------------------------------
    # Option C: AWS Secrets Manager Provider (Uncomment if using AWS)
    # ------------------------------------------------------------------------
    # aws:
    #   service: SecretsManager
    #   region: us-east-1
    #   auth:
    #     jwt:
    #       serviceAccountRef:
    #         name: x4g4t-sa

---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: x4g4t-vault-sync
  namespace: x4g4t
spec:
  refreshInterval: "1h"
  secretStoreRef:
    name: x4g4t-keyvault-store
    kind: SecretStore
  target:
    name: x4g4t-secrets
    creationPolicy: Owner
  data:
    - secretKey: OPENAI_API_KEY
      remoteRef:
        key: x4g4t/llm-keys
        property: OPENAI_API_KEY
    - secretKey: ANTHROPIC_API_KEY
      remoteRef:
        key: x4g4t/llm-keys
        property: ANTHROPIC_API_KEY
    - secretKey: GEMINI_API_KEY
      remoteRef:
        key: x4g4t/llm-keys
        property: GEMINI_API_KEY
    - secretKey: POSTGRES_PASSWORD
      remoteRef:
        key: x4g4t/database
        property: password

