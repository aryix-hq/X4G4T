apiVersion: apps/v1
kind: Deployment
metadata:
  name: x4g4t-client-simulator
  namespace: x4g4t
  labels:
    app.kubernetes.io/name: x4g4t-client-simulator
    app.kubernetes.io/part-of: x4g4t-platform
spec:
  replicas: 1
  selector:
    matchLabels:
      app: x4g4t-client-simulator
  template:
    metadata:
      labels:
        app: x4g4t-client-simulator
    spec:
      containers:
        - name: client-simulator
          image: ghcr.io/aryix-hq/x4g4t-client-simulator:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 4500
          env:
            - name: PORT
              value: "4500"
            - name: PROXY_URL
              value: "http://proxy.x4g4t.svc.cluster.local:4000"
            - name: TEST_KEY
              value: "sec_live_dev_key_12345678901234567890"
            - name: SIMULATION_INTERVAL_MS
              value: "15000"
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 256Mi
          readinessProbe:
            httpGet:
              path: /healthz
              port: 4500
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: 4500
            initialDelaySeconds: 10
            periodSeconds: 15
---
apiVersion: v1
kind: Service
metadata:
  name: client-simulator
  namespace: x4g4t
  labels:
    app.kubernetes.io/name: x4g4t-client-simulator
spec:
  type: ClusterIP
  selector:
    app: x4g4t-client-simulator
  ports:
    - name: http
      port: 4500
      targetPort: 4500
