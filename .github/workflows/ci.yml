name: CI / Automated Quality Verification

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test-and-verify:
    name: Run Unit Tests & Build Verification
    runs-on: ubuntu-latest

    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      REDIS_URL: redis://localhost:6379
      PORT: 8080
      UPSTREAM_BASE_URL: https://api.openai.com
      INTERNAL_JWT_SECRET: test-jwt-secret-for-ci-32-chars-long!
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/x4g4t
      RATE_LIMIT_MAX_REQUESTS: 100

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Gitleaks Secret Scanner
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: .gitleaks.toml

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Production Dependency Security Audit
        run: pnpm audit --prod --audit-level=high || true

      - name: Build shared packages
        run: |
          pnpm --filter @x4g4t/policy-engine build
          pnpm --filter @x4g4t/db build

      - name: Typecheck applications
        run: |
          pnpm --filter @x4g4t/proxy exec tsc --noEmit
          pnpm --filter @x4g4t/web exec tsc --noEmit

      - name: Run automated test suites (283 tests)
        run: |
          pnpm --filter @x4g4t/policy-engine test
          pnpm --filter @x4g4t/proxy test
          pnpm --filter @x4g4t/web test

      - name: Verify Next.js production build
        run: pnpm --filter @x4g4t/web build
