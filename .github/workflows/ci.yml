name: CI / Automated Quality Verification

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test-and-verify:
    name: Run Unit Tests & Build Verification
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck all workspace packages
        run: |
          pnpm --filter @x4g4t/policy-engine exec tsc --noEmit
          pnpm --filter @x4g4t/db exec tsc --noEmit
          pnpm --filter @x4g4t/proxy exec tsc --noEmit
          pnpm --filter @x4g4t/web exec tsc --noEmit

      - name: Run automated test suites (166 tests)
        run: |
          pnpm --filter @x4g4t/policy-engine test
          pnpm --filter @x4g4t/proxy test
          pnpm --filter @x4g4t/web test

      - name: Verify Next.js production build
        run: pnpm --filter @x4g4t/web build
